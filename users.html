const SUPABASE_KEY="sb_publishable_zO2B32Y2yQuysYaZFzjDmA_LTNBbRCQ";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function init(){
 const {data}=await supabaseClient.auth.getUser();
 if(!data.user){location.href="index.html";return;}
 document.getElementById("loggedUser").textContent=data.user.email;
 await loadCompanies(); await loadUsers();
}
async function loadCompanies(){
 const sel=document.getElementById("company");
 sel.innerHTML='<option value="">Select Company</option>';
 const {data,error}=await supabaseClient.from("companies").select("id,company_name").order("company_name");
 if(error){console.error(error);alert(error.message);return;}
 data.forEach(c=>sel.innerHTML+=`<option value="${c.id}">${c.company_name}</option>`);
}
async function loadUsers(){

 if(error){console.error(error);return;}
 const tb=document.getElementById("usersTable");tb.innerHTML="";
 data.forEach(u=>tb.innerHTML+=`<tr><td>${u.employee_code||""}</td><td>${u.full_name||""}</td><td>${u.email||""}</td><td>${u.role||""}</td></tr>`);
}
