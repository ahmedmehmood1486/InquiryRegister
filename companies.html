<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Companies - Inquiry System</title>

<link rel="icon" href="data:,">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
display:flex;
background:#000;
color:white;
}


/* SIDEBAR */

.sidebar{

width:250px;
height:100vh;
background:#111;
padding:20px;

border-right:2px solid #FFD700;

box-shadow:0 0 20px #FFD700;

}


.sidebar h2{

text-align:center;
color:#FFD700;
margin-bottom:30px;

}


.sidebar a{

display:block;
color:white;
text-decoration:none;

padding:12px;

margin:10px 0;

border-radius:8px;

}


.sidebar a:hover{

background:#FFD700;
color:black;

}



/* MAIN */

.main{

flex:1;
padding:20px;

}



.topbar{

background:#111;

padding:15px;

border-radius:10px;

border:1px solid #FFD700;

}


.topbar h2{

color:#FFD700;

}




/* FORM */

.form-box{

margin-top:25px;

background:#111;

padding:20px;

border-radius:10px;

border:1px solid #FFD700;

}


input{

width:45%;

padding:12px;

margin-right:10px;

background:#000;

color:white;

border:1px solid #FFD700;

border-radius:8px;

}



button{

padding:12px 20px;

background:#FFD700;

color:black;

border:none;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}



button:hover{

background:#ffea70;

}




/* TABLE */


.table-box{

margin-top:25px;

background:#111;

padding:20px;

border-radius:10px;

border:1px solid #FFD700;

}



table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}



th{

background:#FFD700;

color:black;

padding:12px;

}



td{

padding:12px;

border-bottom:1px solid #444;

text-align:center;

}



.delete{

background:red;

color:white;

padding:8px 12px;

}


</style>

</head>



<body>


<div class="sidebar">


<h2>
⚡ Inquiry System
</h2>


<a href="dashboard.html">
Dashboard
</a>


<a href="companies.html">
Companies
</a>


<a href="inquiries.html">
Inquiries
</a>


<a href="#">
Users
</a>


<a href="#">
Profile
</a>


<a href="#">
Settings
</a>


</div>





<div class="main">


<div class="topbar">

<h2>
Companies Management
</h2>

</div>





<div class="form-box">


<h3>Add Company</h3>

<br>


<input 
type="text"
id="companyName"
placeholder="Company Name">


<input 
type="text"
id="companyPrefix"
placeholder="3 Digit Prefix"
maxlength="3">



<button onclick="addCompany()">
Add Company
</button>


<p id="message"></p>


</div>






<div class="table-box">


<h2>
Company List
</h2>


<table>


<thead>

<tr>

<th>ID</th>

<th>Company Name</th>

<th>Prefix</th>

<th>Status</th>

<th>Date</th>

<th>Action</th>

</tr>

</thead>



<tbody id="companyTable">

</tbody>


</table>


</div>


</div>







<script>


// ===============================
// SUPABASE CONNECTION
// ===============================


const SUPABASE_URL =
"https://izztjdcxtblqklndxfve.supabase.co";


const SUPABASE_KEY =
"sb_publishable_zO2B32Y2yQuysYaZFzjDmA_LTNBbRCQ";



const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





// ===============================
// CHECK USER LOGIN
// ===============================


async function checkUser(){


const {data,error} =
await supabaseClient.auth.getUser();



if(error || !data.user){

window.location.href="index.html";

return;

}


}


checkUser();







// ===============================
// LOAD COMPANIES
// ===============================


async function loadCompanies(){


const {data,error}=

await supabaseClient

.from("companies")

.select("*")

.order("created_at",{ascending:false});



if(error){

console.log(error.message);

return;

}



let rows="";



data.forEach(company=>{


rows += `

<tr>

<td>${company.id}</td>

<td>${company.company_name}</td>

<td>${company.company_prefix}</td>

<td>

${company.is_active ? "Active" : "Inactive"}

</td>


<td>

${new Date(company.created_at)
.toLocaleDateString()}

</td>


<td>


<button

class="delete"

onclick="deleteCompany('${company.id}')">

Delete

</button>


</td>


</tr>

`;



});



document.getElementById("companyTable").innerHTML =
rows;


}



loadCompanies();








// ===============================
// ADD COMPANY
// ===============================


async function addCompany(){



const name =
document.getElementById("companyName")
.value.trim();



const prefix =
document.getElementById("companyPrefix")
.value.trim()
.toUpperCase();




if(!name){


alert("Enter company name");

return;


}



if(prefix.length !== 3){


alert("Company prefix must be exactly 3 characters");

return;


}






const {error}=

await supabaseClient

.from("companies")

.insert({

company_name:name,

company_prefix:prefix,

is_active:true

});





if(error){


alert(error.message);

return;


}




document.getElementById("companyName").value="";

document.getElementById("companyPrefix").value="";



document.getElementById("message").innerHTML =
"Company Added Successfully";



loadCompanies();



}








// ===============================
// DELETE COMPANY
// ===============================


async function deleteCompany(id){



if(!confirm("Delete this company?")){

return;

}



const {error}=

await supabaseClient

.from("companies")

.delete()

.eq("id",id);





if(error){

alert(error.message);

return;

}



loadCompanies();



}



</script>


</body>

</html>
